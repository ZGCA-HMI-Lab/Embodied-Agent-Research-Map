name: 校验研究地图与分类索引

on:
  pull_request:
    paths:
      - "taxonomy.json"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "catalog/**"
      - "notes/**"
      - "docs/**"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "mindmap*"
      - ".github/workflows/generate-mindmap.yml"
  push:
    paths:
      - "taxonomy.json"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "catalog/**"
      - "notes/**"
      - "docs/**"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "mindmap*"
      - ".github/workflows/generate-mindmap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试数据校验与生成行为
        run: python -m unittest discover -s tests -v
      - name: 检查数据、索引、首页入口及导图是否同步
        run: python scripts/build_catalog.py --check
